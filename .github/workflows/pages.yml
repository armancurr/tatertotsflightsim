name: Deploy to GitHub Pages

# Manual only: run it from the Actions tab. One-time setup: Settings → Pages → Source: "GitHub Actions".
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck and test (unit, fuzz, functional)
        run: |
          npm run typecheck
          npx vitest run --exclude "**/*.e2e.test.ts"

      # Project pages live under https://<owner>.github.io/<repository>/, so every URL in the build
      # needs that prefix. (A user/organisation site named <owner>.github.io lives at the root: use --base=/.)
      - name: Build for https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: npm run build -- --base=/${{ github.event.repository.name }}/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
